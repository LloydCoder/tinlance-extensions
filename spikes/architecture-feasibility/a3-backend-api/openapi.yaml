openapi: 3.1.0
info:
  title: Tinlance Extensions API Feasibility Contract
  version: 0.1.0
  description: Isolated A3 contract fixture; not a production API commitment.
servers:
  - url: http://localhost:8787
paths:
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        "200":
          description: Dependencies ready
        "503":
          description: Dependency not ready
  /v1/me:
    get:
      operationId: getCurrentPrincipal
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified subject and server-resolved tenant context
        "401":
          description: Missing or invalid credentials
  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelTenantJob
      security:
        - bearerAuth: []
      description: |
        Cancellation is tenant-scoped and requires an explicit server-side authorization
        policy. The policy defaults to deny; callers cannot supply tenant context.
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job is cancelled; repeated cancellation is idempotent
        "401":
          description: Missing or invalid credentials
        "403":
          description: Server-side cancellation policy denied the principal
        "404":
          description: Job is missing or not owned by the authenticated tenant
        "405":
          description: Method not allowed
  /v1/outbox/dead-letters/{eventId}/replay:
    post:
      operationId: replayTenantDeadLetter
      security:
        - bearerAuth: []
      description: |
        Requeue is tenant-scoped and requires an explicit server-side authorization
        policy. The policy defaults to deny. Every successful replay is durably
        audited with the verified principal subject and request correlation ID.
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dead-letter event requeued
        "401":
          description: Missing or invalid credentials
        "403":
          description: Server-side replay policy denied the principal
        "404":
          description: Event is missing, not tenant-owned or no longer dead-lettered
        "405":
          description: Method not allowed
  /v1/records/{recordId}:
    get:
      operationId: getTenantRecord
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Tenant-owned record
        "401":
          description: Missing or invalid credentials
        "404":
          description: Missing or not owned by the authenticated tenant
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque access token
