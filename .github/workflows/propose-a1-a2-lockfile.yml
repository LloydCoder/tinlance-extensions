name: Propose A1-A2 lockfile

on:
  workflow_run:
    workflows:
      - Architecture Feasibility A1-A2
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  propose-lockfile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Download lockfile from successful main feasibility run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: a1-a2-pnpm-lockfile
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/a1-a2-artifact
      - name: Open a reviewable lockfile pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          source_file="/tmp/a1-a2-artifact/pnpm-lock.yaml"
          target_file="spikes/architecture-feasibility/a1-a2/pnpm-lock.yaml"
          test -s "$source_file"
          if [ -f "$target_file" ] && cmp -s "$source_file" "$target_file"; then
            echo "Lockfile is already current."
            exit 0
          fi
          branch="automation/a1-a2-lockfile-${{ github.event.workflow_run.run_number }}"
          git checkout -b "$branch"
          mkdir -p "$(dirname "$target_file")"
          cp "$source_file" "$target_file"
          git add "$target_file"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: pin A1-A2 spike dependency lockfile"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Pin A1-A2 feasibility spike dependency lockfile" \
            --body "Generated by a successful trusted-main A1-A2 CI run. This PR commits the exact pnpm lockfile produced by the pinned toolchain; the next CI run verifies a clean frozen-lockfile install."
