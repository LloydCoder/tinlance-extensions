name: Architecture Feasibility A3 API

on:
  pull_request:
    paths:
      - "spikes/architecture-feasibility/a3-backend-api/**"
      - ".github/workflows/architecture-feasibility-a3-api.yml"
  push:
    branches: [main]
    paths:
      - "spikes/architecture-feasibility/a3-backend-api/**"
      - ".github/workflows/architecture-feasibility-a3-api.yml"

permissions:
  contents: read

concurrency:
  group: architecture-feasibility-a3-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: A3 API contract and tenant-isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Run isolated A3 API contract tests
        working-directory: spikes/architecture-feasibility/a3-backend-api
        run: node --test
