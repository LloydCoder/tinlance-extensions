name: Architecture Feasibility A3 PostgreSQL

on:
  pull_request:
    paths:
      - "spikes/architecture-feasibility/a3-backend-api/**"
      - ".github/workflows/architecture-feasibility-a3-postgres.yml"
  push:
    branches: [main]
    paths:
      - "spikes/architecture-feasibility/a3-backend-api/**"
      - ".github/workflows/architecture-feasibility-a3-postgres.yml"

permissions:
  contents: read

concurrency:
  group: architecture-feasibility-a3-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL tenant isolation, outbox and worker recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply core schema migration
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/migrations/001_platform_core.sql
      - name: Verify tenant isolation and transactional outbox
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/postgres.integration.sql
      - name: Apply durable worker lease migration
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/migrations/002_worker_leases.sql
      - name: Verify worker lease recovery and fencing
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/postgres.worker.integration.sql
      - name: Apply transactional outbox publisher migration
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/migrations/003_outbox_publisher.sql
      - name: Verify tenant-bound outbox publisher leases and fencing
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/postgres.outbox-publisher.integration.sql
      - name: Verify concurrent worker claims use SKIP LOCKED
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinlance_test
        run: bash spikes/architecture-feasibility/a3-backend-api/verify-concurrent-worker-claims.sh
      - name: Apply worker lease renewal migration
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/migrations/004_worker_lease_renewal.sql
      - name: Apply outbox delivery retry and heartbeat migration
        env:
          PGPASSWORD: postgres
        run: psql "host=127.0.0.1 port=5432 dbname=tinlance_test user=postgres" -v ON_ERROR_STOP=1 -f spikes/architecture-feasibility/a3-backend-api/migrations/005_outbox_delivery_runtime.sql
      - name: Install pinned PostgreSQL test driver
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
        working-directory: spikes/architecture-feasibility/a3-backend-api
      - name: Exercise HTTP API through the real PostgreSQL adapter
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinlance_test
        working-directory: spikes/architecture-feasibility/a3-backend-api
        run: node --test postgres.repository.integration.test.mjs
      - name: Exercise real worker processes, crash recovery and lease heartbeat
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinlance_test
        working-directory: spikes/architecture-feasibility/a3-backend-api
        run: node --test worker.process.integration.test.mjs
      - name: Exercise outbox delivery idempotency, retries and dead letters
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinlance_test
        working-directory: spikes/architecture-feasibility/a3-backend-api
        run: node --test outbox.process.integration.test.mjs
