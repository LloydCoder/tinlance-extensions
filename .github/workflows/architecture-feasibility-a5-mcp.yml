name: Architecture Feasibility A5 MCP

on:
  pull_request:
    paths:
      - "spikes/architecture-feasibility/a5-mcp-conformance/**"
      - ".github/workflows/architecture-feasibility-a5-mcp.yml"
  push:
    branches: [main]
    paths:
      - "spikes/architecture-feasibility/a5-mcp-conformance/**"
      - ".github/workflows/architecture-feasibility-a5-mcp.yml"

permissions:
  contents: read

concurrency:
  group: architecture-feasibility-a5-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-conformance:
    name: A5 MCP SDK v2 conformance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Install from committed lockfile
        working-directory: spikes/architecture-feasibility/a5-mcp-conformance
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate CycloneDX SBOM
        working-directory: spikes/architecture-feasibility/a5-mcp-conformance
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Export generated SBOM for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a5-cyclonedx-sbom
          path: spikes/architecture-feasibility/a5-mcp-conformance/sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
      - name: Run A5 conformance tests
        working-directory: spikes/architecture-feasibility/a5-mcp-conformance
        run: npm test
