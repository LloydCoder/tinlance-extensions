name: Repository Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: false
      - name: Validate repository contracts and documentation
        run: python scripts/validate_repo.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
