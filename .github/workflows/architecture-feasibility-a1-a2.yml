name: Architecture Feasibility A1-A2

on:
  pull_request:
    paths:
      - "spikes/architecture-feasibility/a1-a2/**"
      - ".github/workflows/architecture-feasibility-a1-a2.yml"
  push:
    branches: [main]
    paths:
      - "spikes/architecture-feasibility/a1-a2/**"
      - ".github/workflows/architecture-feasibility-a1-a2.yml"

permissions:
  contents: read

concurrency:
  group: architecture-feasibility-a1-a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-and-browser-build:
    name: A1-A2 clean install, build and permission tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: spikes/architecture-feasibility/a1-a2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.16.1
      - name: Resolve and install workspace dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi
          pnpm install --frozen-lockfile
      - name: Lint all workspace packages
        run: pnpm lint
      - name: Type-check all workspace packages
        run: pnpm typecheck
      - name: Build Next.js, Chrome/Firefox MV3 and Safari packages
        run: pnpm build
      - name: Verify generated extension permissions
        run: pnpm test
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --global playwright@1.64.1
          playwright install chromium --with-deps
      - name: Verify rendered extension popup runtime and brand tokens
        env:
          NODE_PATH: ${{ runner.tool_cache }}/node_modules
        run: |
          export NODE_PATH="$(npm root --global)"
          xvfb-run -a node scripts/verify-popup-ui.cjs
      - name: Verify Chromium MV3 service-worker termination and event-driven restart
        env:
          NODE_PATH: ${{ runner.tool_cache }}/node_modules
        run: |
          export NODE_PATH="$(npm root --global)"
          xvfb-run -a node scripts/verify-service-worker-lifecycle.cjs
      - name: Install X11 keyboard automation for real action invocation
        run: sudo apt-get install -y xdotool openbox
      - name: Verify Chromium activeTab is granted only by user action
        env:
          NODE_PATH: ${{ runner.tool_cache }}/node_modules
        run: |
          export NODE_PATH="$(npm root --global)"
          xvfb-run -a bash -lc 'openbox --sm-disable >/tmp/openbox.log 2>&1 & sleep 1; node scripts/verify-active-tab-action.cjs'
      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: latest
      - name: Install pinned geckodriver with checksum verification
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz" \
            --output "$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  $RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz" -C "$RUNNER_TEMP/geckodriver-bin"
          chmod 0755 "$RUNNER_TEMP/geckodriver-bin/geckodriver"
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Install pinned Selenium runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/firefox-test-venv"
          "$RUNNER_TEMP/firefox-test-venv/bin/pip" install --disable-pip-version-check --no-cache-dir selenium==4.52.0
      - name: Package permission-sensitive extension for Firefox
        run: |
          set -Eeuo pipefail
          (cd apps/extension-permission-sensitive/.output/firefox-mv3 && zip -qr "$RUNNER_TEMP/tinlance-permission-sensitive-firefox.xpi" .)
      - name: Verify Firefox MV3 activeTab keyboard action
        env:
          FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: "1"
        run: |
          xvfb-run -a bash -lc 'openbox --sm-disable >/tmp/openbox-firefox.log 2>&1 & sleep 1; "$RUNNER_TEMP/firefox-test-venv/bin/python" scripts/verify-firefox-active-tab-action.py "$RUNNER_TEMP/tinlance-permission-sensitive-firefox.xpi"'
      - name: Publish generated lockfile for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a1-a2-pnpm-lockfile
          path: spikes/architecture-feasibility/a1-a2/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
      - name: Publish Safari extension input
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: safari-readonly-extension
          path: spikes/architecture-feasibility/a1-a2/apps/extension-readonly/.output/safari-mv2/
          if-no-files-found: error
          retention-days: 3

  safari-package:
    name: A2 Safari Xcode packaging feasibility
    needs: toolchain-and-browser-build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source for Safari package verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download WXT Safari output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: safari-readonly-extension
          path: ${{ runner.temp }}/safari-readonly-extension
      - name: Package Safari extension and validate Xcode project
        run: |
          set -Eeuo pipefail
          xcrun --find safari-web-extension-packager
          xcrun safari-web-extension-packager \
            --project-location "${{ runner.temp }}/TinlanceReadOnlySpike" \
            --app-name "TinlanceReadOnlySpike" \
            --bundle-identifier "com.tinlance.extensions.spike.TinlanceReadOnlySpike" \
            --swift \
            --macos-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            "${{ runner.temp }}/safari-readonly-extension"
          project="$(find "${{ runner.temp }}/TinlanceReadOnlySpike" -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          test -n "$project"
          xcodebuild -list -project "$project"
          bash spikes/architecture-feasibility/a1-a2/scripts/verify-safari-xcode-build.sh "$project" "$RUNNER_TEMP/safari-derived-data"
      - name: Preserve generated Safari Xcode project for review
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: safari-xcode-project-feasibility
          path: ${{ runner.temp }}/TinlanceReadOnlySpike/
          if-no-files-found: error
          retention-days: 7
